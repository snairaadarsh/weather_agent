<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 860" width="780" height="860">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000055"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="860" fill="#0f172a" rx="16"/>

  <!-- Title -->
  <text x="390" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">🌦️ WeatherAgent — System Workflow</text>
  <text x="390" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">FAISS Vector Search · WeatherAPI · Google Gemini · Hallucination Detection</text>

  <!-- ═══ PHASE 1 ═══ -->
  <rect x="30" y="82" width="720" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="102" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">PHASE 1 — DATA SETUP  (runs once automatically)</text>

  <!-- data_setup.py -->
  <rect x="250" y="112" width="280" height="48" rx="8" fill="#1d4ed8" filter="url(#shadow)"/>
  <text x="390" y="131" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">data_setup.py</text>
  <text x="390" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#93c5fd">Generates historical weather data</text>

  <line x1="310" y1="160" x2="175" y2="188" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="470" y1="160" x2="605" y2="188" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- weather.csv -->
  <rect x="80" y="188" width="190" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="175" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">📄 weather.csv</text>
  <text x="175" y="220" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">20 rows · 10 Indian cities</text>

  <!-- weather.db -->
  <rect x="510" y="188" width="190" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="605" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">🗄️ weather.db</text>
  <text x="605" y="220" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">SQLite · same data</text>

  <!-- ═══ PHASE 2 ═══ -->
  <rect x="30" y="234" width="720" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="254" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">PHASE 2 — BUILD FAISS INDEX  (user clicks "Build Index")</text>

  <!-- User picks source -->
  <rect x="250" y="264" width="280" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">👤 User picks data source</text>
  <text x="390" y="298" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">CSV  or  SQLite DB</text>

  <line x1="175" y1="228" x2="310" y2="264" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="605" y1="228" x2="470" y2="264" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="390" y1="308" x2="390" y2="328" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- vector_store.py -->
  <rect x="180" y="328" width="420" height="48" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="347" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#d1fae5">vector_store.py</text>
  <text x="390" y="363" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6ee7b7">Embed rows with all-MiniLM-L6-v2  →  build FAISS IndexFlatIP</text>

  <!-- ═══ PHASE 3 ═══ -->
  <rect x="30" y="394" width="720" height="430" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="414" font-family="sans-serif" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1">PHASE 3 — QUERY LOOP  (per user message)</text>

  <!-- User query -->
  <rect x="240" y="424" width="300" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="441" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">💬 User query</text>
  <text x="390" y="457" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">"What is the weather in Delhi?"</text>

  <line x1="390" y1="376" x2="390" y2="424" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="468" x2="390" y2="490" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FAISS search -->
  <rect x="210" y="490" width="360" height="48" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="509" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">FAISS Similarity Search</text>
  <text x="390" y="526" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a5b4fc">cosine score ≥ 0.70 threshold?</text>

  <text x="192" y="560" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">YES ✓</text>
  <text x="590" y="560" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f87171">NO ✗</text>

  <line x1="260" y1="538" x2="175" y2="576" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <line x1="520" y1="538" x2="608" y2="576" stroke="#f87171" stroke-width="1.8" marker-end="url(#arr-r)"/>

  <!-- CASE A -->
  <rect x="52" y="576" width="240" height="64" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="172" y="597" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">✅ Case A — Cached Result</text>
  <text x="172" y="614" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#a7f3d0">Returns matched historical text</text>
  <text x="172" y="630" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">source: vector_db</text>

  <!-- CASE B -->
  <rect x="488" y="576" width="242" height="64" rx="10" fill="#431407" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="609" y="597" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">⚡ Case B — Live Lookup</text>
  <text x="609" y="614" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fecaca">Calls WeatherAPI + Gemini LLM</text>
  <text x="609" y="630" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">source: weather_api+llm</text>

  <line x1="550" y1="640" x2="480" y2="674" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="668" y1="640" x2="668" y2="674" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- WeatherAPI -->
  <rect x="370" y="674" width="160" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="450" y="693" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fdba74">🌐 WeatherAPI.com</text>
  <text x="450" y="710" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Real-time temp, condition…</text>

  <!-- Gemini -->
  <rect x="548" y="674" width="160" height="46" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="628" y="693" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fdba74">🤖 Gemini LLM</text>
  <text x="628" y="710" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Natural language answer</text>

  <line x1="450" y1="720" x2="450" y2="746" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="628" y1="720" x2="628" y2="734" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="628" y1="734" x2="530" y2="746" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Validation -->
  <rect x="290" y="746" width="400" height="52" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="766" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fde68a">🔍 Validation — Hallucination Check</text>
  <text x="490" y="784" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fcd34d">Compare LLM temperature vs Live API temperature</text>

  <line x1="490" y1="798" x2="490" y2="818" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Final output -->
  <rect x="190" y="818" width="400" height="30" rx="8" fill="#1d4ed8"/>
  <text x="390" y="838" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">📤 Final Response · source · confidence · verdict</text>
</svg>
